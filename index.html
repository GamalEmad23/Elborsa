/* Favorites: clear heart state and a calm saved-articles shelf */
.bookmark{width:38px;height:38px;padding:0;display:grid;place-items:center;border:1px solid #ffffff17;border-radius:50%;background:#211d19;color:#b7aea4;transition:background .18s,border-color .18s,color .18s,transform .18s}
.bookmark svg{width:18px;height:18px;fill:transparent;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s,fill .18s,color .18s}
.bookmark:hover{background:#382126;color:#ff7188;border-color:#ff718855}
.bookmark.is-saved{background:#3b2027;color:#ff405f;border-color:#ff405f66}
.bookmark.is-saved svg{fill:#ff405f;stroke:#ff405f}
.bookmark:active svg{transform:scale(.86)}
.nav-favorites{display:flex;align-items:center;gap:8px}
.nav-fav-count,.favorite-count{display:inline-grid;place-items:center;min-width:23px;height:23px;padding:0 6px;border-radius:20px;background:#34251d;color:#ffb578;font-size:11px;font-weight:700}
.favorites-section{max-width:1220px;margin:0 auto;padding:50px 24px 8px;scroll-margin-top:24px}
.favorites-head{display:flex;align-items:center;justify-content:space-between;gap:20px;background:linear-gradient(120deg,#201d1b,#191a19);border:1px solid #ffffff13;border-radius:16px;padding:24px 29px;margin-bottom:18px}
.favorites-head h2{display:flex;align-items:center;gap:10px;margin:5px 0;color:#f3eee7;font-size:24px}
.favorites-head p{margin:0;color:#a7a199;font-size:13px}
.favorites-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:#3b2027;color:#ff5870;font-size:24px}
.favorites-empty{display:flex;align-items:center;gap:15px;padding:22px 25px;border:1px dashed #ffffff26;border-radius:14px;background:#1a1b1a;color:#e9e3db}
.favorite-empty-heart{font-size:25px;color:#ff7188}
.favorites-empty b,.favorites-empty small{display:block}.favorites-empty small{margin-top:5px;color:#a7a199}
.favorites-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.favorites-grid .card{min-width:0}
.detail-favorite{margin-right:auto;display:flex;align-items:center;gap:9px;color:#aaa49c}

    <script>const seedArticles = [
 {id:'pe-trap',title:'مكرر الربحية المنخفض: فرصة ولا فخ؟',category:'التحليل المالي',read:'٦ دقائق',date:'١٢ يونيو ٢٠٢٥',featured:true,excerpt:'رقم واحد مش كفاية عشان تحكم على سهم. خلينا نشوف إزاي تقارن الشركات في نفس القطاع.',body:`هل كل ما مكرر الربحية يقل، السهم يبقى أفضل للاستثمار؟ مش بالضرورة. المكرر المنخفض ممكن يكون ميزة، لكنه مش دليل كافي إن السهم رخيص أو أفضل.\n\n## يعني إيه مكرر الربحية؟\nهو سعر السهم مقسوم على ربحية السهم السنوية. لو سعر السهم ١٠٠ جنيه وربحيته ١٠ جنيهات، مكرر الربحية ١٠ مرات.\n\n## إمتى يبقى فخ؟\nممكن الأرباح تكون استثنائية ومش هتتكرر، أو النشاط بيتراجع، أو الديون عالية والتدفقات النقدية ضعيفة. ساعتها الرقم المنخفض ممكن يخبي مشكلة حقيقية.\n\n## قارني الشركات من نفس القطاع\nبصي على نمو الإيرادات والأرباح، وجودة التدفقات النقدية، والمديونية، وهوامش الربح، والعائد على حقوق الملكية. بعد كده قارني المكرر بالتاريخ وبالشركات المشابهة، وقدّري القيمة العادلة وهامش الأمان.\n\nالشركة الأقوى مش شرط تكون الأرخص، والسهم الأرخص مش شرط يكون الأفضل. القرار بيجمع بين قوة الشركة والتقييم المناسب والمخاطر المقبولة.`,tags:['P/E','أساسيات'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'trading-screen',title:'إزاي تقرأ شاشة التداول؟',category:'أساسيات البورصة',read:'٧ دقائق',date:'١٠ يونيو ٢٠٢٥',featured:false,excerpt:'فهم الأسعار والسيولة ودفتر الأوامر والتنفيذات قبل ما تاخدي قرارك.',body:`شاشة التداول فيها أرقام كتير، لكن كل رقم بيحكي جزء من الصورة.\n\n## الأسعار الأساسية\nالافتتاح هو السعر اللي بدأت عنده الجلسة، والأعلى والأدنى هما حدود الحركة لحد اللحظة. الإغلاق السابق هو سعر آخر جلسة مكتملة.\n\n## السيولة وحجم التداول\nحجم التداول هو عدد الأسهم اللي اتنفذت، وقيمة التداول هي إجمالي قيمة الصفقات. قارني النشاط الحالي بالمعتاد، مع معرفة الفترة اللي بيتحسب عليها المتوسط.\n\n## دفتر الأوامر والتنفيذات\nدفتر الأوامر بيعرض نوايا الشراء والبيع، لكنها ممكن تتغير أو تتلغي. شاشة التنفيذات بتعرض الصفقات اللي تمت فعلًا. الفرق بين أفضل طلب وأفضل عرض اسمه الفارق السعري.\n\nاللون الأخضر أو حجم الطلبات لوحده مش إشارة مؤكدة. اربطي الشاشة بحركة السعر والحجم والاتجاه وإدارة المخاطر.`,tags:['مبتدئين','تداول'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'strong-company',title:'إزاي تختاري شركة قوية ماليًا؟',category:'التحليل المالي',read:'٥ دقائق',date:'٨ يونيو ٢٠٢٥',featured:false,excerpt:'قائمة عملية لمراجعة الإيرادات والأرباح والتدفقات النقدية والديون.',body:`قبل ما تشتري سهم للاستثمار، ادرسي الشركة نفسها: هل مبيعاتها بتزيد؟ وهل أرباحها جاية من نشاطها الأساسي ولا من بنود استثنائية؟\n\nراجعي التدفقات النقدية التشغيلية، والتدفقات النقدية الحرة بعد الإنفاق الرأسمالي، ومستوى الديون مقارنة بقدرة الشركة على السداد. بصي كمان على هوامش الربح والعائد على حقوق الملكية.\n\nقارني نتائج آخر ٣ إلى ٥ سنوات بشركات من نفس القطاع. المؤشرات بتختلف حسب طبيعة النشاط؛ تقييم البنك مش زي تقييم شركة عقارات أو صناعة.`,tags:['قوائم مالية','استثمار'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'fair-value',title:'القيمة العادلة وهامش الأمان',category:'التحليل المالي',read:'٦ دقائق',date:'٦ يونيو ٢٠٢٥',featured:false,excerpt:'القيمة العادلة تقدير مبني على افتراضات، مش وعد إن السعر هيوصل له.',body:`القيمة العادلة تقدير لقيمة السهم بالاعتماد على أرباح الشركة وأصولها وتدفقاتها النقدية وتوقعات نموها ومخاطرها.\n\nممكن نستخدم مضاعف الربحية للشركات ذات الأرباح المستقرة، أو نقارن القيمة الدفترية بجودة الأصول، أو نقدّر التدفقات النقدية المستقبلية. كل طريقة لها افتراضاتها وحدودها.\n\nلو تقديرك للقيمة العادلة ٥٠ جنيه والسعر ٣٥، ده خصم تقديري، لكنه مش ضمان للصعود. اتركي هامش أمان وراجعي التقييم لما تتغير النتائج أو الديون أو ظروف القطاع.`,tags:['تقييم','أساسيات'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'build-portfolio',title:'خطوات لبناء محفظة استثمارية',category:'إدارة المخاطر',read:'٧ دقائق',date:'٤ يونيو ٢٠٢٥',featured:false,excerpt:'حددي هدفك ومدتك وقدرتك على تحمل التذبذب قبل توزيع استثماراتك.',body:`ابدئي بهدف واضح ومدة زمنية تناسبك، وحددي المبلغ اللي تقدري تستثمريه من غير ما تحتاجيه قريب.\n\nنوّعي بين الشركات والقطاعات، وخلي وزن السهم الواحد مناسب. الدخول على مراحل يديكي مرونة بدل استثمار كامل السيولة عند سعر واحد. وجود احتياطي نقدي ممكن يساعد وقت التراجعات أو الفرص.\n\nقبل كل صفقة، اكتبي سبب الدخول والسيناريو اللي يخليكي تعيدي تقييم القرار. الاستثمار مش توصية جاهزة، وكل محفظة لازم تناسب صاحبتها.`,tags:['محفظة','تنويع'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'support-resistance',title:'الدعم والمقاومة ببساطة',category:'التحليل الفني',read:'٥ دقائق',date:'٢ يونيو ٢٠٢٥',featured:false,excerpt:'مناطق سعرية بتساعدك تفهم حركة السهم، لكنها مش إشارات مضمونة.',body:`الدعم منطقة ظهر عندها مشترون قبل كده وأوقفت الهبوط مؤقتًا. المقاومة منطقة ظهر عندها ضغط بيع وأبطأت الصعود.\n\nفكري فيها كمناطق مش أرقام دقيقة. لمس الدعم مش معناه إن السعر لازم يرتد، ومجرد اختراق المقاومة مش تأكيد لوحده. راقبي الإغلاق وحجم التداول واتجاه السوق، وحددي مسبقًا مستوى إلغاء الفكرة.`,tags:['شارت','مبتدئين'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'risk-plan',title:'حددي مخاطرتك قبل ما تشتري',category:'إدارة المخاطر',read:'٤ دقائق',date:'٣١ مايو ٢٠٢٥',featured:false,excerpt:'خطة واضحة للدخول والخروج أهم من محاولة توقع كل حركة.',body:`قبل ما تدخلي صفقة، اسألي نفسك: إيه سبب الشراء؟ إيه اللي يثبت إن فكرتي كانت غلط؟ وإيه حجم الخسارة اللي أقدر أتحمله؟\n\nحددي حجم الصفقة ووقف الخسارة والهدف وفق خطتك، وخلي العائد المحتمل مناسب للمخاطرة. ما تستخدميش فلوس محتاجاها قريب أو ديون للتداول.`,tags:['إدارة رأس المال','خطة'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'invest-vs-trade',title:'الاستثمار والمضاربة: اختاري طريقتك',category:'أساسيات البورصة',read:'٥ دقائق',date:'٢٩ مايو ٢٠٢٥',featured:false,excerpt:'المدة الزمنية وطريقة اتخاذ القرار بتفرق بين الاستثمار والتداول قصير الأجل.',body:`المستثمر غالبًا بيركز على جودة الشركة ونموها وتقييمها على مدى أطول. المتداول بيركز أكثر على حركة السعر والسيولة وخطة دخول وخروج أقرب.\n\nمفيش أسلوب مناسب للجميع. اختاري الطريقة حسب وقتك وخبرتك وقدرتك على تحمل التذبذب، وافصلي بين مراكز الاستثمار وصفقات التداول عشان ما تتلخبطش الخطة.`,tags:['استثمار','تداول'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'reading-financials',title:'منين تبدأي قراءة القوائم المالية؟',category:'التحليل المالي',read:'٦ دقائق',date:'٢٧ مايو ٢٠٢٥',featured:false,excerpt:'ابدئي بالإيرادات وصافي الربح والتدفق النقدي والالتزامات.',body:`القوائم المالية بتديكي صورة عن أداء الشركة ومركزها. ابدئي بقائمة الدخل عشان تشوفي الإيرادات وهوامش الربح، وبعدها الميزانية لمراجعة الأصول والالتزامات وحقوق المساهمين.\n\nقائمة التدفقات النقدية بتوضح إذا كانت الأرباح بتتحول لنقد فعلي. قارني الفترات المتتالية، واقرئي الإيضاحات عشان تفهمي البنود غير المتكررة.`,tags:['تعليم','قوائم مالية'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'psychology',title:'نفسيتك جزء من خطة الاستثمار',category:'إدارة المخاطر',read:'٤ دقائق',date:'٢٥ مايو ٢٠٢٥',featured:false,excerpt:'اسألي نفسك عن وقتك وقدرتك على تحمل النزول قبل تحديد أسلوبك.',body:`قبل ما تختاري سهم، اختاري أسلوب يناسبك. تقدري تتابعي السوق يوميًا؟ تقدري تستحملي تذبذب السعر من غير ما تغيّري خطتك كل ساعة؟\n\nكتابة سبب الشراء وقواعد المراجعة بتساعد تقللي القرارات الانفعالية. ما تخليش لون الشاشة أو الخوف من فوات الفرصة ياخد القرار مكانك.`,tags:['سلوك المستثمر','تخطيط'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'fundamentals',title:'ليه القطاع مهم في مقارنة الأسهم؟',category:'التحليل المالي',read:'٤ دقائق',date:'٢٣ مايو ٢٠٢٥',featured:false,excerpt:'كل نشاط له مقاييسه، فاختاري مقارنة عادلة بين شركات متشابهة.',body:`البنوك مثلًا بنراجع فيها جودة القروض والقيمة الدفترية والعائد على حقوق الملكية. في العقارات نهتم بالمشروعات والتعاقدات والتدفقات. وفي الصناعة نراجع تكلفة الخامات وهوامش الربح.\n\nالمقارنة بين قطاعات مختلفة ممكن تضللنا. افهمي طبيعة إيرادات الشركة ودورة نشاطها قبل الحكم على مضاعفاتها.`,tags:['قطاعات','تحليل'],source:'المحتوى التعليمي - ياسمين شاكر'},
 {id:'orders',title:'دفتر الأوامر مش توقع لحركة السهم',category:'أساسيات البورصة',read:'٤ دقائق',date:'٢١ مايو ٢٠٢٥',excerpt:'الأوامر المعروضة ممكن تتغير؛ التنفيذات الفعلية بتقول جزء مختلف من القصة.',body:`دفتر الأوامر بيعرض عروض البيع وطلبات الشراء الموجودة حاليًا، لكنه مش سجل نهائي. الأوامر ممكن تتعدل أو تختفي قبل التنفيذ.\n\nالصفقات المنفذة بتقول إيه اللي حصل بالفعل. ومع ذلك، لا يكفي لون التنفيذ وحده لمعرفة الاتجاه. اربطي المعلومات بالسعر والحجم والسياق.`,tags:['سيولة','تداول'],source:'المحتوى التعليمي - ياسمين شاكر'}
];

addEventListener('click',()=>{editing=articles.find(a=>a.id===e.dataset.edit);modal=true;render()}));root.querySelectorAll('[data-delete]').forEach(e=>e.addEventListener('click',()=>{confirmDelete=e.dataset.delete;render();root.querySelector('[data-cancel-delete]')?.focus()}));root.querySelector('[data-cancel-delete]')?.addEventListener('click',()=>{confirmDelete=null;render()});root.querySelector('[data-confirm-backdrop]')?.addEventListener('click',e=>{if(e.target===e.currentTarget){confirmDelete=null;render()}});root.querySelector('[data-confirm-delete]')?.addEventListener('click',async()=>{const id=confirmDelete;confirmDelete=null;try{await removeArticle(id);toast('اتحذف المقال من المكتبة')}catch{toast('تعذر حذف المقال. تحققي من الاتصال والصلاحيات.','error')}});root.querySelectorAll('[data-action="close"]').forEach(e=>e.addEventListener('click',ev=>{if(ev.target===e||e.tagName==='BUTTON'){modal=false;render()}}));root.querySelector('#editor')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const a={...editing,title:f.get('title'),category:f.get('category'),read:f.get('read'),excerpt:f.get('excerpt'),body:f.get('body'),tags:f.get('tags').split('،').map(x=>x.trim()).filter(Boolean)};try{await saveArticle(a);modal=false;toast('اتحفظت التغييرات');render()}catch(err){toast('تعذر الحفظ. راجعي تسجيل الدخول وقواعد فايربيز.','error')}});root.querySelector('#login')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);try{await sdk.signInWithEmailAndPassword(auth,f.get('email'),f.get('password'))}catch(err){console.error('Firebase sign-in failed:',err);const messages={'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحين.','auth/invalid-email':'صيغة البريد الإلكتروني غير صحيحة.','auth/user-disabled':'الحساب موقوف من إعدادات Firebase Authentication.','auth/too-many-requests':'محاولات كثيرة؛ انتظري قليلًا ثم حاولي مرة أخرى.','auth/operation-not-allowed':'تسجيل الدخول بالبريد وكلمة المرور غير مفعّل في Firebase.','auth/unauthorized-domain':'عنوان الموقع غير مسموح في Firebase Authentication.','auth/network-request-failed':'تعذر الاتصال. تحققي من الإنترنت ثم حاولي ثانية.'};root.querySelector('#login-error').textContent=location.protocol==='file:'?'افتحي الموقع عبر localhost أو رابط الاستضافة؛ تسجيل الدخول لا يعمل عند فتح الملف مباشرة.':messages[err.code]||`تعذر الدخول (${err.code||'خطأ غير معروف'}). راجعي إعدادات Firebase.`}});root.querySelector('[data-action="logout"]')?.addEventListener('click',()=>sdk.signOut(auth));root.querySelector('[data-action="seed"]')?.addEventListener('click',async()=>{try{for(const a of seedArticles){const{ id, ...content }=a;await saveArticle(content)};toast('تم استيراد المحتوى التعليمي')}catch{toast('تعذر الاستيراد. تأكدي من صلاحيات المدير.','error')}});root.querySelector('[data-tour-next]')?.addEventListener('click',()=>{if(tourIndex>=tourSteps.length-1){tourIndex=-1;localStorage.setItem(tourKey,'1');document.documentElement.style.removeProperty('--tour-x');document.documentElement.style.removeProperty('--tour-y');document.documentElement.style.removeProperty('--tour-radius');document.documentElement.style.scrollBehavior=''}else tourIndex++;render()});root.querySelector('[data-tour-prev]')?.addEventListener('click',()=>{if(tourIndex>0){tourIndex--;render()}});root.querySelector('[data-tour-skip]')?.addEventListener('click',()=>{tourIndex=-1;localStorage.setItem(tourKey,'1');document.documentElement.style.removeProperty('--tour-x');document.documentElement.style.removeProperty('--tour-y');document.documentElement.style.removeProperty('--tour-radius');document.documentElement.style.scrollBehavior='';render()})}
async function saveArticle(a){if(!sdk){const id=a.id||`local-${Date.now()}`;const item={...a,id,date:a.date||new Intl.DateTimeFormat('ar-EG',{dateStyle:'medium'}).format(new Date())};articles=a.id?articles.map(x=>x.id===id?item:x):[item,...articles];localStorage.setItem(storeKey,JSON.stringify(articles));return}const{id,...data}=a;if(id)await sdk.updateDoc(sdk.doc(db,'articles',id),{...data,updatedAt:sdk.serverTimestamp()});else await sdk.addDoc(sdk.collection(db,'articles'),{...data,createdAt:sdk.serverTimestamp(),updatedAt:sdk.serverTimestamp()})}
async function removeArticle(id){if(sdk)await sdk.deleteDoc(sdk.doc(db,'articles',id));else{articles=articles.filter(a=>a.id!==id);localStorage.setItem(storeKey,JSON.stringify(articles))}render()}
render();
const config=window.FIREBASE_CONFIG||{};
if(Object.values(config).every(Boolean)){
 try{const base='https://www.gstatic.com/firebasejs/13.2.0/';const [appMod,authMod,fireMod]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);sdk={...authMod,...fireMod};const app=appMod.initializeApp(config);auth=authMod.getAuth(app);db=fireMod.getFirestore(app);authMod.onAuthStateChanged(auth,async current=>{user=current;if(current){try{const role=await fireMod.getDoc(fireMod.doc(db,'admins',current.uid));if(!role.exists()){user=null;await authMod.signOut(auth);toast('الحساب ده مش مضاف كمدير')}else if(admin)render()}catch{user=null;toast('تعذر التحقق من صلاحية الحساب','error')}}else if(admin)render()});fireMod.onSnapshot(fireMod.query(fireMod.collection(db,'articles'),fireMod.orderBy('createdAt','desc')),snapshot=>{articles=snapshot.docs.map(d=>({id:d.id,...d.data()}));render()},error=>{console.error(error);toast('تعذر تحميل المقالات من فايربيز','error')})}catch(error){console.error('Firebase initialization failed',error);toast('تعذر الاتصال بفايربيز. تحقق من إعدادات المشروع','error')}}




})();</script>
